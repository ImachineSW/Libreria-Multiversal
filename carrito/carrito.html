<!DOCTYPE html>
<html>
    <head>
        <title>Carrito</title> <!--Titulo de pagina-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/css/carrito.css"> <!--Vincular carrito.css con carrito.html-->
        <link rel="icon" type="image/png" href="/img/favicon.png"> <!--Favicon-->
    </head>
    <body>
        <header>
         <div class="banner"> <!--Contenedor del banner-->
            <table id="tabla-banner"> <!--Tabla para el banner-->
                <tr>
                    <td>
                        <a href="/index.html">
                            <img src="/img/multiversal.png" alt="Logo de Multiversal Librería" class="logo"> <!--Logo de la libreria-->
                        </a>
                    </td>
                    <td class="derecha"> <!--Contenedor de la parte derecha del banner-->
                        <a href="/sesion/login/login.html"> <!--Redirecciona al html de login-->
                            <img src="/img/usuario.png" alt="Usuario icon." class="usuario">
                        </a>
                    </td>
                </tr>
            </table>
        </div>
        </header>
        <main>
            <div class="contenedor">
                <div class="carrito">
                    <h1>Carrito de Compras</h1>
                    <div class="productos">
                        <div class="producto">
                            <img src="/img/Libros/elheroeperdido.jpg" alt="El Heroe Perdido">
                                <h2>El Heroe Perdido</h2>
                                <p>Precio: $875</p>
                                <button class="eliminar">Eliminar</button>
                        </div>
                    </div>
                </div>
                <div class="resumen">
                    <h2>Resumen</h2>
                    <p>El Heroe Perdido: $875</p>
                    <button class="comprar">Comprar</button>
                </div>
            </div>
        </main>
    </body>
</html>
