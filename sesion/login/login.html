<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--para que se vea bien en cualquier dispositivo-->
    <title>Login</title>
    <link rel="stylesheet" href="../../css/login.css">
</head>
<body>

<div class="zona"> <!--Contenedor principal de la página-->
    <form class="log"> <!--Formulario de inicio de sesión-->
        <h1>Iniciar sesión</h1>

        <input type="text" placeholder="Usuario" required> <!--Pedir usuario-->
        <input type="password" placeholder="Contraseña" required> <!--Pedir contraseña-->

        <button type="submit">Ingresar</button> <!--Botón enviar-->

        <p>¿No tienes una cuenta? <a href="../register/register.html">Registrarse</a></p> <!--Enlace a la página de registro-->
    </form>
</div>

</body>
</html>
