<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--para que se vea bien en cualquier dispositivo-->
    <title>Registro</title>
    <link rel="stylesheet" href="../../css/register.css">
</head>
<body>

<div class="container"> <!--Contenedor principal de la página-->
    <form class="register"> <!--Formulario de registro-->

        <h1>Crear Cuenta</h1>

        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="Ingrese su usuario" required> <!--Pedir usuario-->

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="Ingrese su correo electrónico" required> <!--Pedir correo electrónico-->

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Ingrese su contraseña" required> <!--Pedir contraseña-->

        <label for="confirmar">Repetir contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repita su contraseña" required> <!--Pedir repetir contraseña-->

        <div class="opciones">
            <label>
                <input type="checkbox" name="recordar"> <!--checkbox de recordar-->
                Recordarme
            </label>
        </div>

        <div class="opciones">
            <label>
                <input type="checkbox" name="terminos" required> <!--checkbox de aceptar términos y condiciones-->
                Acepto los <a href="#">Términos y Condiciones</a>
            </label>
        </div>

        <button type="submit">Registrarse</button> <!--Botón enviar-->

        <p>¿Ya tienes una cuenta? <a href="../login/login.html">Iniciar sesión</a></p> <!--Enlace a la página de inicio de sesión-->

    </form>
</div>

</body>
</html>
